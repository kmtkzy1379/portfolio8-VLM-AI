# BoT-SORT with Re-ID enabled - Custom config for stable ID tracking
# Based on ultralytics default botsort.yaml with Re-ID optimization

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.3
track_buffer: 45
match_thresh: 0.8
fuse_score: True

# BoT-SORT specifics
gmc_method: sparseOptFlow

# ReID: enabled for appearance-based re-identification
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: True
model: auto
